    function loadSavedState() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          if (p.lang && ['ar', 'fr', 'en'].includes(p.lang)) appState.lang = p.lang;
          if (p.programMode) appState.programMode = p.programMode;
          if (p.profile) Object.assign(appState.profile, p.profile);
          if (p.workoutLogs) appState.workoutLogs = p.workoutLogs;
          if (p.measurements && p.measurements.length) appState.measurements = p.measurements;
          if (p.customDayExercises && p.customDayExercises.joint_safe) {
            Object.assign(appState.customDayExercises.joint_safe, p.customDayExercises.joint_safe);
            if (!appState.customDayExercises.joint_safe.D) appState.customDayExercises.joint_safe.D = ['EX27', 'EX28', 'EX29', 'EX30', 'EX31', 'EX32'];
          }
        }
      } catch (e) {}
    }

      t.classList.remove('hidden');

      window.__toastTm = setTimeout(() => t.classList.add('hidden'), 2400);

    // Double-Tap / Click vs Single-Tap Handler on Images
    let lastTapTime = 0;
    function handleImageTap(exId, ev) {
      if (ev) ev.stopPropagation();
      const now = Date.now();
      if (now - lastTapTime < 320) {
        // Double tap detected -> Open Fullscreen Lightbox!
        openPhotoLightbox(exId, ev);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        togglePhotoFrame(exId, ev);
      }
    }

    // =========================================================================
    // 4. REST TIMER ENGINE (WITH PRESET CYCLING)
    // =========================================================================
    let timerState = { durationSec: 90, remainingSec: 90, endMs: null, running: false, id: null };
    function updateTimerUI() {
      const d = document.getElementById('hdr-timer-display');
      const b = document.getElementById('hdr-timer-btn');
      const m = Math.floor(timerState.remainingSec / 60);
      const s = timerState.remainingSec % 60;
      if (d) d.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (b) b.textContent = timerState.running ? '⏸' : '▶';
    }
    function cycleTimerPreset() {
      const presets = [60, 90, 120, 150];
      const next = presets[(presets.indexOf(timerState.durationSec) + 1) % presets.length] || 90;
      startRestTimer(next);
      showToast(tr(`⏱️ تم ضبط مؤقت الراحة على ${next} ثانية`, `⏱️ Minuteur réglé sur ${next}s`, `⏱️ Rest timer set to ${next}s`));
    }
    function startRestTimer(sec) {
      timerState.durationSec = sec;
      timerState.remainingSec = sec;
      timerState.endMs = Date.now() + sec * 1000;
      timerState.running = true;
      clearInterval(timerState.id);
      timerState.id = setInterval(() => {
        const left = Math.ceil((timerState.endMs - Date.now()) / 1000);
        if (left <= 0) {
          timerState.remainingSec = 0; timerState.running = false; clearInterval(timerState.id);
          updateTimerUI();
          showToast(tr('🔔 انتهت الراحة! ابدأ المجموعة التالية.', '🔔 Repos terminé !', '🔔 Rest complete!'));
        } else {
          timerState.remainingSec = left; updateTimerUI();
        }
      }, 250);
      updateTimerUI();
    }
    function toggleRestTimerPause() {
      if (timerState.running) { timerState.running = false; clearInterval(timerState.id); updateTimerUI(); }
      else { startRestTimer(timerState.remainingSec > 0 ? timerState.remainingSec : timerState.durationSec); }
    }
    function resetRestTimer() {
      timerState.running = false; clearInterval(timerState.id); timerState.remainingSec = timerState.durationSec; updateTimerUI();
    }

    // =========================================================================
    // 6. PILLAR 1: HOME & ZERO-OVERFLOW MOBILE WORKOUT PLAYER
    // =========================================================================
    function calculateBiometrics() {
      const p = appState.profile;
      const bmr = (10 * p.weightKg) + (6.25 * p.heightCm) - (5 * p.age) + 5;
      const tdee = bmr * p.activityFactor;
      const delta = p.goalMode === 'recomp_train' ? 100 : p.goalMode === 'recomp_rest' ? -200 : p.goalMode === 'lean_bulk' ? 250 : -400;
      const targetKcal = Math.round(tdee + delta);
      const proteinG = Math.round(p.weightKg * 2.05);
      const fatG = Math.round(p.weightKg * 0.85);
      const carbsG = Math.round(Math.max(400, targetKcal - proteinG * 4 - fatG * 9) / 4);
      const bmi = (p.weightKg / ((p.heightCm / 100) ** 2)).toFixed(1);
      return { bmr: Math.round(bmr), tdee: Math.round(tdee), targetKcal, proteinG, fatG, carbsG, bmi };
    }

    function computeVolume() {
      const dm = appState.customDayExercises[appState.programMode] || appState.customDayExercises.joint_safe;
      const t = {};
      Object.keys(MUSCLE_GROUPS).forEach(k => t[k] = { direct: 0, indirect: 0, effective: 0, list: [] });
      ['A', 'B', 'C', 'D'].forEach(d => {
        (dm[d] || []).forEach(id => {
          const ex = EXERCISES_DB.find(e => e.id === id);
          if (!ex) return;
          if (t[ex.primaryMuscle]) {
            t[ex.primaryMuscle].direct += ex.sets;
            t[ex.primaryMuscle].effective += ex.sets;
            t[ex.primaryMuscle].list.push({ id: ex.id, name: trObj(ex, 'name'), day: d, sets: ex.sets });
          }
          (ex.secondaryMuscles || []).forEach(s => {
            if (t[s]) {
              t[s].indirect += ex.sets * 0.5;
              t[s].effective += ex.sets * 0.5;
            }
          });
        });
      });
      return t;
    }

    function applySwap(oldId, newId) {
      const dm = appState.customDayExercises[appState.programMode];

      renderMainView();
      showToast(tr('🔄 تم استبدال التمرين بنجاح!', '🔄 Exercice remplacé !', '🔄 Exercise swapped!'));

              <div><label class="text-slate-400 block mb-1">${tr('الوزن (kg)', 'Poids', 'Weight')}</label><input type="number" step="0.5" value="${p.weightKg}" onchange="updateProfileField('weightKg',this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-white mono-num"></div>
              <div>
                <label class="text-slate-400 block mb-1">${tr('الهدف', 'Objectif', 'Goal')}</label>
                <select onchange="updateProfileField('goalMode',this.value)" class="w-full bg-slate-900 border border-emerald-500/50 rounded-xl px-2 py-2 text-emerald-300 font-bold">
                  <option value="recomp_train" ${p.goalMode==='recomp_train'?'selected':''}>${tr('يوم تدريب (+100)', 'Entraînement (+100)', 'Training (+100)')}</option>
                  <option value="recomp_rest" ${p.goalMode==='recomp_rest'?'selected':''}>${tr('يوم راحة (-200)', 'Repos (-200)', 'Rest (-200)')}</option>
                  <option value="lean_bulk" ${p.goalMode==='lean_bulk'?'selected':''}>${tr('تضخيم (+250)', 'Masse (+250)', 'Lean Bulk (+250)')}</option>
                  <option value="fat_loss" ${p.goalMode==='fat_loss'?'selected':''}>${tr('تنشيف (-400)', 'Sèche (-400)', 'Cut (-400)')}</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
              <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800"><div class="text-slate-400 text-[10px]">BMI</div><div class="text-base font-extrabold text-white mono-num">${bio.bmi}</div></div>
              <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800"><div class="text-slate-400 text-[10px]">BMR</div><div class="text-base font-extrabold text-sky-400 mono-num">${bio.bmr}</div></div>
              <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800"><div class="text-slate-400 text-[10px]">TDEE</div><div class="text-base font-extrabold text-amber-400 mono-num">${bio.tdee}</div></div>
              <div class="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40"><div class="text-emerald-300 font-bold text-[10px]">${tr('المستهدف', 'Cible Kcal', 'Target Kcal')}</div><div class="text-base font-extrabold text-emerald-400 mono-num">${bio.targetKcal}</div></div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30"><div class="text-emerald-300 font-bold text-[11px]">${tr('بروتين', 'Protéines', 'Protein')}</div><div class="text-base font-extrabold text-white mono-num">${bio.proteinG}g</div></div>
              <div class="p-2.5 rounded-xl bg-sky-500/10 border border-sky-500/30"><div class="text-sky-300 font-bold text-[11px]">${tr('كارب', 'Glucides', 'Carbs')}</div><div class="text-base font-extrabold text-white mono-num">${bio.carbsG}g</div></div>
              <div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30"><div class="text-amber-300 font-bold text-[11px]">${tr('دهون', 'Lipides', 'Fats')}</div><div class="text-base font-extrabold text-white mono-num">${bio.fatG}g</div></div>
            </div>
          </div>
        `;
      }

      if (appState.nutriSubTab === 'meals') {
        const meals = appState.customMeals[appState.activeMealPreset || 'training'];
        let tk = 0, tp = 0;
        return subNav + `
          <div class="app-card p-3.5 sm:p-5 space-y-3">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <h3 class="text-xs sm:text-base font-extrabold text-white">🍽️ ${tr('وجباتي اليومية', 'Plan de Repas', 'Daily Meals')}</h3>
              <div class="flex gap-1">
                <button onclick="setMealPreset('training')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold ${appState.activeMealPreset==='training'?'bg-emerald-500 text-slate-950':'bg-slate-800 text-slate-300'}">${tr('يوم تدريب', 'Entraînement', 'Training')}</button>
                <button onclick="setMealPreset('rest')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold ${appState.activeMealPreset==='rest'?'bg-emerald-500 text-slate-950':'bg-slate-800 text-slate-300'}">${tr('يوم راحة', 'Repos', 'Rest')}</button>
              </div>
            </div>
            ${meals.map((m, mi) => `
              <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                <div class="text-xs font-extrabold text-emerald-400">${trObj(m, 'title')}</div>
                ${m.items.map((it, ii) => {
                  const f = MOROCCAN_FOOD_DB.find(x => x.id === it.foodId) || MOROCCAN_FOOD_DB[0];
                  const k = Math.round(f.kcal * it.grams / 100);
                  const pr = Math.round(f.p * it.grams / 100);
                  tk += k; tp += pr;
                  return `
                    <div class="flex items-center justify-between gap-1.5 py-1.5 border-b border-slate-800/60 text-xs">
                      <div class="min-w-0 flex-1 truncate"><span class="font-bold text-white">${trObj(f, 'name')}</span></div>
                      <div class="flex items-center gap-1 shrink-0">
                        <button onclick="stepMealGrams(${mi},${ii},-10)" class="step-btn rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">−</button>
                        <span class="mono-num font-bold text-emerald-300 w-11 text-center text-[11px]">${it.grams}g</span>
                        <button onclick="stepMealGrams(${mi},${ii},10)" class="step-btn rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">+</button>
                        <span class="mono-num text-slate-400 text-[10px] w-16 text-left">${k}kcal</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `).join('')}
            <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 flex justify-between text-xs font-extrabold">
              <span class="text-emerald-300">${tr('إجمالي الوجبات:', 'Total :', 'Total:')}</span>
              <span class="mono-num text-white">${tk} kcal • ${tp}g P</span>
            </div>
          </div>
        `;
      }

      if (appState.nutriSubTab === 'foods') {
        const tot = {};
        ['training', 'rest'].forEach(mode => {
          const mult = mode === 'training' ? 3 : 4;
          appState.customMeals[mode].forEach(m => m.items.forEach(it => { tot[it.foodId] = (tot[it.foodId] || 0) + it.grams * mult; }));
        });
        return subNav + `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-3.5">
            <div class="lg:col-span-7 app-card p-3.5 space-y-2.5">
              <h3 class="text-xs sm:text-sm font-extrabold text-white">🇲🇦 ${tr('قاعدة الأغذية المغربية (لكل 100g)', 'Base Alimentaire (100g)', 'Moroccan Foods (100g)')}</h3>
              <div class="space-y-1.5 max-h-80 overflow-y-auto custom-scroll">
                ${MOROCCAN_FOOD_DB.map(f => `
                  <div class="p-2 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-2 text-xs">
                    <div class="min-w-0 truncate"><span class="font-bold text-white">${trObj(f, 'name')}</span> <span class="text-[10px] text-slate-400">(${trObj(f, 'state')})</span></div>
                    <div class="mono-num text-[11px] shrink-0"><span class="text-amber-300 font-bold">${f.kcal}kcal</span> • <span class="text-emerald-400 font-bold">${f.p}P</span></div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="lg:col-span-5 app-card p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs sm:text-sm font-extrabold text-white">🛒 ${tr('قائمة التسوق الأسبوعية', 'Liste de Courses', 'Weekly Grocery List')}</h3>
                <button onclick="window.print()" class="px-2 py-1 rounded-lg bg-slate-800 text-xs">🖨️</button>
              </div>
              <div class="space-y-1.5 text-xs">
                ${Object.keys(tot).map(id => {
                  const f = MOROCCAN_FOOD_DB.find(x => x.id === id);
                  if (!f) return '';
                  const rawG = Math.round(tot[id] * f.rawFactor);
                  const disp = rawG >= 1000 ? `${(rawG/1000).toFixed(2)} kg` : `${rawG} g`;
                  return `<label class="flex justify-between p-2 rounded-xl bg-slate-900 border border-slate-800"><span class="flex items-center gap-2 truncate"><input type="checkbox" class="accent-emerald-500"> ${trObj(f, 'name')}</span><span class="mono-num text-emerald-300 font-bold shrink-0">${disp}</span></label>`;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      return subNav + `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${SUPPLEMENTS_DB.map(s => {
            const doseFn = appState.lang === 'fr' ? s.doseFr : (appState.lang === 'en' ? s.doseEn : s.doseAr);
            return `
              <div class="app-card p-3.5 space-y-2 border-t-4 border-t-emerald-500">
                <span class="text-[10px] font-bold text-emerald-400">${s.tier}</span>
                <h3 class="text-sm font-extrabold text-white">${trObj(s, 'name')}</h3>
                <p class="text-xs text-slate-200">${doseFn(p.weightKg)}</p>
                <p class="text-[11px] text-slate-400">${trObj(s, 'note')}</p>
                <a href="${s.refUrl}" target="_blank" rel="noopener noreferrer" class="inline-block text-xs font-bold text-sky-400 hover:underline">🔬 PubMed / ISSN ↗</a>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setNutriSubTab(s) { appState.nutriSubTab = s; renderMainView(); }
    function updateProfileField(f, v) {
      appState.profile[f] = isNaN(parseFloat(v)) ? v : parseFloat(v);
      saveAppState();
      renderMainView();
    }
    function setMealPreset(k) { appState.activeMealPreset = k; renderMainView(); }
    function stepMealGrams(mi, ii, delta) {
      const p = appState.activeMealPreset || 'training';
      const item = appState.customMeals[p][mi].items[ii];
      item.grams = Math.max(0, item.grams + delta);
      saveAppState();
      renderMainView();
    }

    // =========================================================================
    // 10. PILLAR 4: PROGRESS, AI COACH & SCIENCE / BACKUP
    // =========================================================================
    function renderProgressPillar() {
      const subNav = `
        <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800">
          <button onclick="setProgSubTab('metrics')" class="sub-pill ${appState.progSubTab==='metrics'?'active':'text-slate-300'} py-2 px-1.5 rounded-xl text-[11px] font-bold transition truncate">📏 ${tr('القياسات', 'Mensurations', 'Metrics')}</button>
          <button onclick="setProgSubTab('coach')" class="sub-pill ${appState.progSubTab==='coach'?'active':'text-slate-300'} py-2 px-1.5 rounded-xl text-[11px] font-bold transition truncate">🧠 ${tr('المدرب والركبة', 'Coach & Genoux', 'AI Coach')}</button>
          <button onclick="setProgSubTab('refs')" class="sub-pill ${appState.progSubTab==='refs'?'active':'text-slate-300'} py-2 px-1.5 rounded-xl text-[11px] font-bold transition truncate">🔬 ${tr('العلم والنسخ', 'Science & JSON', 'Science & JSON')}</button>
        </div>
      `;

      if (appState.progSubTab === 'metrics') {
        const pts = appState.e1rmHistory.EX01 || [30.5, 32.0, 33.5, 34.7];
        const minV = Math.min(...pts) * 0.92, maxV = Math.max(...pts) * 1.05;
        const coords = pts.map((v, i) => ({ x: 45 + i * (320 / Math.max(1, pts.length - 1)), y: 145 - ((v - minV) / Math.max(1, maxV - minV)) * 100, v }));
        return subNav + `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-3.5">
            <div class="lg:col-span-5 app-card p-3.5 space-y-3">
              <h3 class="text-xs sm:text-sm font-extrabold text-white">📏 ${tr('تسجيل القياسات الأسبوعية', 'Enregistrer les Mensurations', 'Log Body Measurements')}</h3>
              <div class="grid grid-cols-3 gap-2 text-xs">
                <div><label class="text-slate-400 block mb-1 text-[10px]">${tr('الوزن', 'Poids', 'Weight')}</label><input type="number" id="m-weight" step="0.1" value="${appState.profile.weightKg}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-white mono-num"></div>
                <div><label class="text-slate-400 block mb-1 text-[10px]">${tr('الخصر', 'Taille', 'Waist')}</label><input type="number" id="m-waist" step="0.5" value="90.0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-white mono-num"></div>
                <div><label class="text-slate-400 block mb-1 text-[10px]">${tr('الذراع', 'Bras', 'Arm')}</label><input type="number" id="m-arm" step="0.2" value="38.5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-white mono-num"></div>
              </div>
              <button onclick="saveMeasurement()" class="w-full py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">+ ${tr('حفظ القياس', 'Enregistrer', 'Save')}</button>
              <div class="space-y-1.5 text-xs">
                ${appState.measurements.slice().reverse().map(m => `
                  <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 flex justify-between mono-num text-[11px]">
                    <span class="text-slate-400">${m.date}</span>
                    <span class="text-emerald-400 font-bold">${m.weight}kg</span>
                    <span class="text-sky-300">${m.waist}cm</span>
                    <span class="text-amber-300">${m.arm}cm</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="lg:col-span-7 app-card p-3.5 space-y-2.5">
              <h3 class="text-xs sm:text-sm font-extrabold text-white">📈 ${tr('تطور القوة التقديرية (e1RM)', 'Progression de Force (e1RM)', 'Estimated 1RM Progression')}</h3>
              <div class="bg-slate-950 rounded-xl p-2.5 border border-slate-800">
                <svg viewBox="0 0 420 170" class="w-full max-h-[170px]">
                  <polyline fill="none" stroke="#10b981" stroke-width="3.5" points="${coords.map(c=>`${c.x},${c.y}`).join(' ')}"/>
                  ${coords.map(c=>`<circle cx="${c.x}" cy="${c.y}" r="5" fill="#10b981"/><text x="${c.x}" y="${c.y-10}" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">${c.v}kg</text>`).join('')}
                </svg>
              </div>
            </div>
          </div>
        `;
      }

      if (appState.progSubTab === 'coach') {
        const s = appState.profile.sleepHrs || 7.5;
        const k = appState.profile.kneePain ?? 1;
        return subNav + `
          <div class="app-card p-3.5 sm:p-5 space-y-3.5">
            <h3 class="text-sm sm:text-base font-extrabold text-white">🧠 ${tr('المدرب الذكي التكيفي وبروتوكول تسكين الركبة', 'Coach IA & Analgésie Rotulienne', 'AI Coach & Knee Rehab')}</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-1.5">
                <div class="flex justify-between"><span>${tr('ساعات النوم', 'Sommeil', 'Sleep')}</span><strong class="mono-num text-emerald-400">${s}h</strong></div>
                <input type="range" min="4" max="10" step="0.5" value="${s}" oninput="updateCoachSlider('sleepHrs',this.value)" class="w-full accent-emerald-500">
              </div>
              <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-1.5">
                <div class="flex justify-between"><span>${tr('انزعاج الركبة (0–10)', 'Gêne au genou', 'Knee Sensitivity')}</span><strong class="mono-num text-amber-400">${k}/10</strong></div>
                <input type="range" min="0" max="10" step="1" value="${k}" oninput="updateCoachSlider('kneePain',this.value)" class="w-full accent-amber-500">
              </div>
            </div>

            <div class="p-3.5 rounded-xl bg-slate-900 border ${k>=4?'border-amber-500/40':'border-emerald-500/40'} text-xs space-y-1">
              <div class="font-extrabold ${k>=4?'text-amber-300':'text-emerald-400'}">
                ${k>=4 ? tr('⚠️ توصية وقائية للركبة اليوم:', '⚠️ Ajustement Préventif Genou :', '⚠️ Proactive Knee Adjustment:') : tr('✅ جاهزية مفصلية ممتازة:', '✅ Excellente Stabilité :', '✅ Optimal Joint Readiness:')}
              </div>
              <p class="text-slate-200 leading-relaxed">
                ${k>=4
                  ? tr('ابدأ بـ 3 مجموعات Spanish Squat أيزومتري (45 ثانية) لتفعيل التسكين العصبي لوتر الرضفة، وخفف وزن Leg Extension بنسبة 15%.', 'Effectuez 3×45s de Spanish Squat isométrique avant la séance et réduisez la charge du Leg Extension de 15%.', 'Perform 3×45s isometric Spanish Squat holds and reduce Leg Extension load by 15%.')
                  : tr('حالة الركبة مستقرة؛ يمكنك تطبيق التدرج المزدوج (Double Progression) عند RIR 1–2.', 'Genou stable ; poursuivez votre surcharge progressive à RIR 1–2.', 'Knee comfort is optimal; proceed with normal Double Progression at 1–2 RIR.')}
              </p>
            </div>

            <button onclick="startRestTimer(45)" class="w-full py-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-extrabold text-xs">
              ⏱️ ${tr('تشغيل مؤقت Spanish Squat (45 ثانية)', 'Minuteur Spanish Squat (45s)', 'Start 45s Spanish Squat Timer')}
            </button>
          </div>
        `;
      }

      return subNav + `
        <div class="app-card p-3.5 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 class="text-xs sm:text-sm font-extrabold text-white">💾 ${tr('النسخ الاحتياطي (JSON)', 'Sauvegarde (JSON)', 'JSON Backup')}</h3>
          </div>
          <div class="flex gap-1.5">
            <button onclick="exportJsonBackup()" class="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">⬇️ ${tr('تصدير', 'Exporter', 'Export')}</button>
            <label class="px-3 py-1.5 rounded-xl bg-sky-500/20 text-sky-300 border border-sky-500/40 font-extrabold text-xs cursor-pointer">
              ⬆️ ${tr('استيراد', 'Importer', 'Import')}
              <input type="file" accept=".json" onchange="importJsonBackup(this)" class="hidden" />
            </label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${SCIENTIFIC_REFERENCES.map(r => `
            <div class="app-card p-3.5 space-y-1.5 text-xs">
              <div class="font-extrabold text-white">${r.title}</div>
              <div class="text-sky-300 font-semibold">${r.authors}</div>
              <p class="text-slate-300 leading-relaxed">${trObj(r, 'desc')}</p>
              <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="inline-block text-emerald-400 hover:underline font-bold">🔗 PubMed / PMC ↗</a>
            </div>
          `).join('')}
        </div>
      `;
    }

    function setProgSubTab(s) { appState.progSubTab = s; renderMainView(); }
    function updateCoachSlider(f, v) { appState.profile[f] = parseFloat(v); saveAppState(); renderMainView(); }
    function saveMeasurement() {
      const w = parseFloat(document.getElementById('m-weight')?.value) || 85;
      const waist = parseFloat(document.getElementById('m-waist')?.value) || 90;
      const arm = parseFloat(document.getElementById('m-arm')?.value) || 38.5;
      appState.measurements.push({ date: new Date().toISOString().slice(0, 10), weight: w, waist, arm });
      appState.profile.weightKg = w;
      saveAppState();
      renderMainView();
      showToast(tr('📏 تم حفظ القياس بنجاح!', '📏 Mensuration enregistrée !', '📏 Measurement saved!'));
    }

    function changeProgramMode(m) {
      appState.programMode = m;
      saveAppState();
      renderMainView();
      showToast(m === 'joint_safe'
        ? tr('🛡️ تم تفعيل الوضع الصديق للمفاصل', '🛡️ Mode Articulations Protégées activé', '🛡️ Joint-Safe Mode enabled')
        : tr('🏋️ تم تفعيل الوضع القياسي', '🏋️ Mode Standard activé', '🏋️ Standard Mode enabled'));
    }

    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'hypertrophy_os_v4.2_backup.json'; a.click();
      URL.revokeObjectURL(url);
      showToast(tr('⬇️ تم تحميل النسخة الاحتياطية', '⬇️ Sauvegarde téléchargée', '⬇️ Backup downloaded'));
    }

    function importJsonBackup(inp) {
      if (!inp.files?.[0]) return;
      const r = new FileReader();
      r.onload = (e) => {
        try { Object.assign(appState, JSON.parse(e.target.result)); saveAppState(); renderAll(); showToast(tr('⬆️ تمت استعادة البيانات', '⬆️ Données restaurées', '⬆️ Backup restored')); }
        catch { showToast('⚠️ Invalid JSON'); }
      };
      r.readAsText(inp.files[0]);
    }

    function renderMainView() {
      const box = document.getElementById('app-main-view');
      if (!box) return;
      if (appState.mainTab === 'home') box.innerHTML = renderHomePillar();
      else if (appState.mainTab === 'exercises') box.innerHTML = renderExercisesPillar();
      else if (appState.mainTab === 'nutrition') box.innerHTML = renderNutritionPillar();
      else box.innerHTML = renderProgressPillar();
    }

    function renderAll() {
      renderTopNav();
      renderMainView();
      if (!document.getElementById('exercise-modal')?.classList.contains('hidden')) {
        renderExerciseModalContent();
      }
      if (!document.getElementById('photo-lightbox-modal')?.classList.contains('hidden')) {
        updateLightboxUI();
      }
      updateTimerUI();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      setLanguage(appState.lang || 'ar');
    });
  </script>
</body>
</html>
